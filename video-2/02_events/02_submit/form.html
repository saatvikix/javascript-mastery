<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #222;
        }
        input{
            display:block;
            margin:10px;
            background-color: black;
            border:2px solid white;
            border-radius: 10px;
            padding:8px;
            color: white;
            width:200px;
        }

        .card{
            margin:auto;
            border:2px solid white;
            height: 400px;
            border-radius: 10px;
            padding:8px;
            color: white;
            width:400px;
            padding:30px;
            text-align: center;
        }

        .profilePic{

            width: 45%;
            height: 45%;
            border-radius: 50%;
            margin:auto;
            
        }

        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            overflow: hidden;
            border-radius: 50%;
        }
        
    
    </style>
</head>
<body>

    <div id="main">
        <form action="">
            <input type="text" name="name" id="" placeholder="Name">
            <input type="text" name="age" id="" placeholder="Age">
            <input type="email" name="email" id="" placeholder="Email">
            <input type="text" name="   pic" id="" placeholder="Profile Pic URL">
            <input type="submit" value="Submit">
        </form>
    </div>

    
    
    <script src="script.js"></script>
</body>
</html>
